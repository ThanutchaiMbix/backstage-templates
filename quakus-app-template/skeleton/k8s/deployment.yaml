apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${{ values.application_name }}
  labels:
    app: ${{ values.application_name }}
    backstage.io/kubernetes-id: ${{ values.application_name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ${{ values.application_name }}
  template:
    metadata:
      labels:
        app: ${{ values.application_name }}
        backstage.io/kubernetes-id: ${{ values.application_name }}
    spec:
      containers:
        - name: ${{ values.application_name }}
          # tag "latest" เป็นค่าตั้งต้น — Tekton (update-manifests step) จะ bump
          # เป็น commit sha ให้อัตโนมัติทุกครั้งที่ build แล้ว ArgoCD จะ sync ตาม
          image: ${{ values.image }}:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: APPLICATION_NAME
              value: "${{ values.application_name }}"
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ${{ values.application_name }}
  labels:
    app: ${{ values.application_name }}
spec:
  selector:
    app: ${{ values.application_name }}
  ports:
    - port: 80
      targetPort: 8080
---
# OpenShift Route — URL จะเป็น https://<name>-<namespace>.<clusterAppsDomain>
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ${{ values.application_name }}
  labels:
    app: ${{ values.application_name }}
    backstage.io/kubernetes-id: ${{ values.application_name }}
spec:
  to:
    kind: Service
    name: ${{ values.application_name }}
  port:
    # สำคัญ: targetPort ต้องเป็น container port (8080) — ใส่เป็น service front port (80)
    # แล้ว router จะ resolve ไม่เจอ (backend ว่าง → 503)
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
