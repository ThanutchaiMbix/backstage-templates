# Application
quarkus.application.name=${APPLICATION_NAME:quarkus-service}

# OpenAPI schema จะถูก generate จาก code ลง target/openapi/openapi.yaml ตอน build
# (ใช้อ้างอิงให้ API entity ใน catalog ตรงกับ code จริง)
quarkus.smallrye-openapi.store-schema-directory=target/openapi

# REST
app.greeting=Hello

# Camel demo route
app.camel.timer-period=10s

# ---------------------------------------------------------------------------
# ข้อ 5: Profile-based configuration — ใช้ prefix "%<profile>." ในไฟล์เดียวกัน
# (built-in: dev / test / prod, เลือกด้วย -Dquarkus.profile=<name> หรืออัตโนมัติ:
#  `mvn quarkus:dev` = dev, java -jar = prod)
# หลีกเลี่ยงการแยกไฟล์ application-dev.properties — ใช้ prefix ในไฟล์นี้ไฟล์เดียว
# ---------------------------------------------------------------------------
%dev.app.camel.timer-period=3s
%dev.quarkus.log.category."com.example".level=DEBUG
